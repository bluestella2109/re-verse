<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE:VERSE // PROJECT-AI TERMINAL SYSTEM</title>
    <!-- フォント: Share Tech Mono(英語), Noto Sans JP(日本語) -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="crt-filter">
    <!-- 背景演出レイヤー -->
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>

    <div id="terminal-container">
        <!-- 0. システムヘッダー -->
        <header class="sys-header">
            <div class="sys-logo">SYSTEM: RE:VERSE // VER 2.0</div>
            <div class="sys-id" id="display-name">ID: UNKNOWN_USER</div>
        </header>

        <!-- メイン画面：ロビーとゲームが切り替わる -->
        <main id="main-viewport">

            <!-- 1. ログイン/ロビー画面 -->
            <section id="lobby" class="screen">
                <div class="lobby-layout">
                    <!-- 左パネル：認証フォーム -->
                    <div class="auth-panel">
                        <div class="panel-header">認証シーケンス開始</div>
                        <h1 class="glitch-text" data-text="TERMINAL LOGIN">TERMINAL LOGIN</h1>
                        
                        <div class="input-form">
                            <div class="field">
                                <label>識別名を入力せよ (USER_NAME)</label>
                                <input type="text" id="user-name" placeholder="エージェント名" maxlength="12" autocomplete="off">
                            </div>
                            <div class="field">
                                <label>侵入先のROOM_ID (5文字)</label>
                                <input type="text" id="room-id" placeholder="00000" maxlength="5" autocomplete="off">
                            </div>
                            <button id="btn-connect" class="neon-button primary">
                                <span class="shimmer"></span>
                                CONNECT_TO_NETWORK
                            </button>
                        </div>
                    </div>

                    <!-- 右パネル：待機ルーム一覧 -->
                    <div class="sidebar-panel">
                        <div class="panel-tag">▶ ネットワーク内待機中のセッション</div>
                        <div id="active-rooms" class="room-list">
                            <!-- JSでルーム一覧がここに自動挿入されます -->
                            <div class="loading-status">スキャン中...</div>
                        </div>
                        <div class="panel-footer">STATUS: LISTENING...</div>
                    </div>
                </div>
            </section>

            <!-- 2. ゲームメイン画面 -->
            <section id="game" class="screen hidden">
                <!-- 【敵機ステータス (盤面より上)】 -->
                <div class="hud-top-enemy">
                    <div class="target-label">TARGET : [ <span id="p2-name-label">ENEMY_AI</span> ]</div>
                    <div class="hp-container enemy">
                        <div id="p2-hp-fill" class="hp-bar enemy"></div>
                    </div>
                    <div class="hp-info">敵機整合性: <span id="p2-hp-val">100</span>%</div>
                </div>

                <div class="arena-middle">
                    <!-- フェーズ表示バー -->
                    <div id="phase-banner" class="phase-alert">ATTACK_PHASE</div>
                    
                    <div class="game-arena-layout">
                        <!-- サイドログ -->
                        <div class="game-log-panel">
                            <div class="log-title">ACTION_LOG</div>
                            <div id="log-content"></div>
                        </div>

                        <!-- 盤面グリッド -->
                        <div class="board-frame">
                            <div id="grid-board" class="grid-5x5">
                                <!-- JSで25マス生成 -->
                            </div>
                        </div>

                        <!-- 右側ミッション指示 -->
                        <div class="mission-instruction">
                            <div class="instr-title">命令指示書</div>
                            <div id="instr-text">
                                相手の逃走経路を<br>予測し、対象マスを<br>マークせよ。
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 【自機ステータス (盤面より下)】 -->
                <div class="hud-bottom-user">
                    <div class="my-hp-info">自機整合性: <span id="p1-hp-val">100</span>%</div>
                    <div class="hp-container user">
                        <div id="p1-hp-fill" class="hp-bar user"></div>
                    </div>
                    <div class="user-label-wrap">
                        <div class="my-label">OPERATOR : [ <span id="p1-name-label">YOU</span> ]</div>
                        <!-- 操作用確定ボタン -->
                        <button id="btn-action" class="execute-btn" disabled>ACTION_CONFIRM</button>
                    </div>
                </div>
            </section>

        </main>

        <!-- コーナーパーツ（装飾） -->
        <div class="deco tl"></div><div class="deco tr"></div>
        <div class="deco bl"></div><div class="deco br"></div>
    </div>

    <!-- リザルトオーバーレイ -->
    <div id="result-screen" class="overlay hidden">
        <div class="result-modal">
            <div class="res-title" id="res-status-title">OPERATION_FAILED</div>
            <div class="res-details">
                コアの再構築が必要です。<br>
                接続を維持しますか？
            </div>
            <button onclick="location.reload()" class="neon-button">RETRY_SESSION</button>
        </div>
    </div>

    <!-- Firebase SDK (互換レイヤー) -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <!-- メインプログラム -->
    <script src="script.js"></script>
</body>
</html>
